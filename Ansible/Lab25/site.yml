---
- name: Lab25 - Automated Configuration on RHEL
  hosts: managed
  become: true

  tasks:
    - name: Install Docker and kubectl
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - kubectl
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Install Java 21 and fontconfig
      ansible.builtin.dnf:
        name:
          - java-21-openjdk
          - fontconfig
          - wget
        state: present

    - name: Download Jenkins LTS repository file
      ansible.builtin.command:
        cmd: wget -qO /etc/yum.repos.d/jenkins.repo https://pkg.jenkins.io/rpm-stable/jenkins.repo
        creates: /etc/yum.repos.d/jenkins.repo

    - name: Download Jenkins signing key
      ansible.builtin.command:
        cmd: wget -qO /etc/pki/rpm-gpg/jenkins.io-2026.key https://pkg.jenkins.io/rpm-stable/jenkins.io-2026.key
        creates: /etc/pki/rpm-gpg/jenkins.io-2026.key

    - name: Import Jenkins repository signing key
      ansible.builtin.rpm_key:
        state: present
        key: /etc/pki/rpm-gpg/jenkins.io-2026.key

    - name: Install Jenkins
      ansible.builtin.dnf:
        name: jenkins
        state: present

    - name: Enable and start Jenkins
      ansible.builtin.systemd:
        name: jenkins
        enabled: true
        state: started
        daemon_reload: true

    - name: Verify Docker version
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Verify kubectl version
      ansible.builtin.command: kubectl version --client
      register: kubectl_version
      changed_when: false

    - name: Verify Java version
      ansible.builtin.command: java -version
      register: java_version
      changed_when: false
      failed_when: java_version.rc != 0

    - name: Verify Jenkins package
      ansible.builtin.command: rpm -q jenkins
      register: jenkins_version
      changed_when: false

    - name: Display installed software
      ansible.builtin.debug:
        msg:
          - "{{ docker_version.stdout }}"
          - "{{ kubectl_version.stdout }}"
          - "{{ java_version.stderr }}"
          - "{{ jenkins_version.stdout }}"

    - name: Verify Docker service
      ansible.builtin.command: systemctl is-active docker
      changed_when: false

    - name: Verify Jenkins service
      ansible.builtin.command: systemctl is-active jenkins
      changed_when: false
