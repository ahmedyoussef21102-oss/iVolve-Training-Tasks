apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ivovle
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ahmedyoussef21102-oss/iVolve-Training-Tasks.git
    targetRevision: main
    path: Jenkins/Lab22/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: ivolve
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
