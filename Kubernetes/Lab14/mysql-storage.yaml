apiVersion: v1
kind: PersistentVolume
metadata:
  name: ivolvedb-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  hostPath:
    path: /mnt/mysql-data
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - nti.aiops
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ivolvedb-pvc
  namespace: ivolve
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: ivolvedb-pv
  resources:
    requests:
      storage: 1Gi
